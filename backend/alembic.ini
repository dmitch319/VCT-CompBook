# Alembic config. The database URL comes from DATABASE_URL (see migrations/env.py),
# never from this file, so no credentials live in git.
#
#   alembic upgrade head                                   # apply all migrations
#   alembic downgrade -1                                   # roll back one
#   alembic revision -m "add something" --rev-id 0002      # new migration (raw SQL inside)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
